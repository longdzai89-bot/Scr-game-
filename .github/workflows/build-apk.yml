name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm --workspace web run build

      - name: Copy game into APK
        run: |
          rm -rf apk/www
          mkdir -p apk/www
          cp -r web/dist/. apk/www/

      - name: Install Capacitor
        run: npm --workspace apk install

      - name: Install Android platform
        run: npm --workspace apk install @capacitor/android

      - name: Add Android platform
        run: npx --workspace apk cap add android

      - name: Sync Android
        run: npx --workspace apk cap sync android

      - name: Build APK
        run: |
          chmod +x apk/android/gradlew
          cd apk/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-platform-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
